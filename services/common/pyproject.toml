[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-common"
version = "1.0.0"
description = "Librería compartida de AegisVolt: configuración por ambiente, logs JSON a CloudWatch, correlation_id, feature flags y helpers DynamoDB"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "boto3>=1.35",
  "httpx>=0.27",
  "pydantic>=2.7",
  "tzdata>=2024.1",
]

[tool.setuptools.packages.find]
include = ["aegis_common*"]
