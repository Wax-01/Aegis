# Ambiente estático: prod  (namespace creado por Terraform en el workspace "prod")
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegisvolt-prod
resources:
  - ../../base
labels:
  - pairs:
      aegisvolt.io/environment: prod
    includeSelectors: false
configMapGenerator:
  - name: frontend-config
    files:
      - config.js
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target: { kind: Service, name: graphql-gateway }
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30082
  - target: { kind: Service, name: frontend }
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30092
  # prod: 2 réplicas estables por microservicio (alta disponibilidad).
  - target: { kind: Deployment, labelSelector: "track=stable,app notin (frontend)" }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
