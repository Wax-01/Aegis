# Ambiente estático: test  (namespace creado por Terraform en el workspace "test")
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegisvolt-test
resources:
  - ../../base
labels:
  - pairs:
      aegisvolt.io/environment: test
    includeSelectors: false
configMapGenerator:
  - name: frontend-config
    files:
      - config.js
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target: { kind: Service, name: graphql-gateway }
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30081
  - target: { kind: Service, name: frontend }
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30091
