# SPA estática servida por nginx. /config.js (ConfigMap por ambiente) le indica a qué endpoint GraphQL
# conectarse: el MISMO bundle se promueve dev -> test -> prod sin recompilar.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: { app: frontend }
spec:
  type: NodePort
  selector: { app: frontend }
  ports:
    - { name: http, port: 8080, targetPort: http, nodePort: 30090 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app: frontend, track: stable }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: frontend, track: stable }
  template:
    metadata:
      labels: { app: frontend, track: stable }
    spec:
      containers:
        - name: web
          image: aegisvolt/frontend:CURRENT
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          volumeMounts:
            - { name: runtime-config, mountPath: /usr/share/nginx/html/config.js, subPath: config.js }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
      volumes:
        - name: runtime-config
          configMap: { name: frontend-config }
