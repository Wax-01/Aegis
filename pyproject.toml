# Configuración compartida de herramientas de calidad (no es un paquete instalable).
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["frontend", "infra", "deploy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
  "B008",  # FastAPI usa llamadas en defaults (Depends/Query)
  "E501",  # el largo de línea lo gestiona `ruff format`; quedan solo strings largos
]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
  "integration: requiere Floci y los servicios levantados",
  "e2e: flujo completo contra el endpoint GraphQL",
]
